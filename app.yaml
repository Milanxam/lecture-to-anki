# Digital Ocean App Platform Specification
# https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: lecture-to-anki

services:
  - name: worker
    github:
      repo: Milanxam/lecture-to-anki
      branch: main
      deploy_on_push: true
    
    # Use Dockerfile for build
    dockerfile_path: Dockerfile
    
    # This is a worker (background job), not a web service
    instance_count: 1
    instance_size_slug: professional-xs  # 1 vCPU, 1GB RAM - adjust as needed
    
    # Environment variables (set these in DO dashboard)
    envs:
      - key: POE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PYTHONUNBUFFERED
        scope: RUN_TIME
        value: "1"
    
    # Run command
    run_command: python lecture_to_anki.py --input-dir /app/lectures --output-dir /app/output


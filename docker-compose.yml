version: '3.8'

services:
  lecture-to-anki:
    build: .
    volumes:
      - ./lectures:/app/lectures:ro
      - ./output:/app/output
      - ./temp:/app/temp
      - ./prompts:/app/prompts:ro
    environment:
      - POE_API_KEY=${POE_API_KEY}
    command: [
      "--input-dir", "/app/lectures",
      "--output-dir", "/app/output",
      "--temp-dir", "/app/temp"
    ]

